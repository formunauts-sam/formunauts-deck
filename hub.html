<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Internal hub on a public host: link-shareable, but keep it out of search results -->
  <meta name="robots" content="noindex, nofollow" />
  <title>FORMUNAUTS — Demo Hub</title>

  <!-- Brand tokens (shared with the deck) + hub styling. CHROME. -->
  <link rel="stylesheet" href="template/brand.css" />
  <link rel="stylesheet" href="template/hub/hub.css" />
</head>
<body>
  <header class="hub-top">
    <img class="hub-top__logo" src="assets/logos/logo-visual-type-blue.png" alt="FORMUNAUTS" />
    <p class="hub-top__eyebrow overline">Marketing · Demo and Look Ahead</p>
    <h1 class="hub-top__title">Demo Hub</h1>
    <p class="hub-top__sub">Every demo deck, ready for launch. Open, share, or plan the next one.</p>
  </header>

  <main class="hub">
    <!-- Active demo — the live-or-newest deck as a hero band + the ghost
         plan card. hub.js fills both. The grouped library below owns the
         "Up next / Recent / Archive" section labels, so the hero band gets
         its own label to avoid a duplicate "Up next" heading. -->
    <section class="hub-next" aria-labelledby="hub-next-heading">
      <h2 class="hub-section__label overline" id="hub-next-heading">Active demo</h2>
      <div class="hub-next__row">
        <div id="hub-hero"></div>
        <div id="hub-plan"></div>
      </div>
    </section>

    <!-- Library — grouped sections (Up next / Recent / Archive), one card
         per manifest entry. hub.js fills #hub-grid with the whole grouped
         set; each group carries its own labelled heading. -->
    <div id="hub-grid" class="hub-library"></div>
  </main>

  <footer class="hub-foot">
    <p>FORMUNAUTS · internal demo platform · decks live in decks/, the list in decks/manifest.js</p>
  </footer>

  <script type="module" src="template/hub/hub.js"></script>
</body>
</html>
