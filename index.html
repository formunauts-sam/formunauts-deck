<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Internal deck on a public host: link-shareable, but keep it out of search results -->
  <meta name="robots" content="noindex, nofollow" />
  <title>FORMUNAUTS — Marketing Update</title>

  <!-- CHROME. Never edited per-demo. -->
  <link rel="stylesheet" href="dist/reset.css" />
  <link rel="stylesheet" href="dist/reveal.css" />
  <link rel="stylesheet" href="template/brand.css" />
  <link rel="stylesheet" href="template/deck.css" />
  <link rel="stylesheet" href="plugin/customcontrols/style.css" />
  <link rel="stylesheet" href="plugin/marker/marker.css" />
  <link rel="stylesheet" href="template/interactive.css" />
  <!-- Wave 4 Engage: poll archetype result bars + reaction ticker (deck-side) -->
  <link rel="stylesheet" href="template/engage/engage.css" />
</head>
<body>
  <div class="reveal"><div class="slides"><!-- render.js injects <section>s here --></div></div>

  <!-- Presenter console (separate window) + fullscreen present, bottom-right -->
  <button class="present-btn present-btn--console" type="button" id="open-presenter">Presenter ▸</button>
  <button class="present-btn" type="button"
          onclick="document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()">
    Present ▸
  </button>

  <!-- Vendored reveal.js core + plugins (CDN-free) -->
  <script src="dist/reveal.js"></script>
  <script src="plugin/notes.js"></script>
  <script src="plugin/marker/plugin.js"></script>
  <script src="plugin/customcontrols/plugin.js"></script>

  <script type="module">
    import { renderDeck } from "./template/render.js";
    import { initAnim } from "./template/anim.js";
    import { initInteractive } from "./template/interactive.js";
    import { initDeckLink } from "./template/presenter/deck-link.js";
    import { initCollab } from "./template/collab.js";
    import { initHud } from "./template/engage/hud.js";
    import { ACTIVE_DECK } from "./decks/manifest.js";

    /* ---------------------------------------------------------------
       Deck selection. Default = the active demo, which is ALWAYS the
       newest manifest entry (ACTIVE_DECK = manifest[0]). This is the
       single source of truth shared with the hub hero and presenter.js,
       so they can never drift apart. ?deck=YYYY-MM-DD loads
       decks/YYYY-MM-DD.deck.js with no html edit.
    --------------------------------------------------------------- */
    const DEFAULT_DECK = ACTIVE_DECK;
    const wanted = new URLSearchParams(location.search).get("deck") || DEFAULT_DECK;
    const safe = /^[0-9A-Za-z._-]+$/.test(wanted) ? wanted : DEFAULT_DECK;

    let deck;
    try {
      ({ deck } = await import(`./decks/${safe}.deck.js`));
    } catch (err) {
      console.error(`[deck] could not load "${safe}", falling back to ${DEFAULT_DECK}`, err);
      ({ deck } = await import(`./decks/${DEFAULT_DECK}.deck.js`));
    }
    if (deck?.meta?.title) document.title = `FORMUNAUTS — ${deck.meta.title}`;

    renderDeck(deck, document.querySelector(".slides"));  // build DOM from data

    Reveal.initialize({
      /* Scaling — author at 1280×720; we own margins in deck.css */
      width: 1280, height: 720, margin: 0, minScale: 0.2, maxScale: 2.0, center: false,

      /* PDF export — exactly one page per slide */
      pdfMaxPagesPerSlide: 1, pdfSeparateFragments: false,

      /* Motion — brand ease-out-expo; entrance stagger is auto-playing CSS */
      transition: "fade", transitionSpeed: "default", backgroundTransition: "fade",
      autoAnimateEasing: "cubic-bezier(0.16, 1, 0.3, 1)", autoAnimateDuration: 0.6,
      autoAnimateUnmatched: false,
      fragments: false,

      /* Clean share — hide idle cursor, no nav chrome on the shared window */
      hideInactiveCursor: true, hideCursorTime: 3000,
      controls: false, progress: false,

      hash: true,
      defaultTiming: 45,   /* per-slide override via data-timing (presenter pacing) */

      /* Plugins — all vendored locally. Marker replaces pointer + chalkboard. */
      plugins: [ RevealNotes, RevealCustomControls, RevealMarker ],
      customcontrols: {
        collapseIcon: "▾", expandIcon: "▸",
        controls: [
          { icon: "◉", title: "Laser (L)",         action: "RevealMarker.setMode('laser');" },
          { icon: "✎", title: "Marker (M)",        action: "RevealMarker.toggle('ink');" },
          { icon: "◍", title: "Spotlight (K)",     action: "RevealMarker.toggle('spotlight');" },
          { icon: "☰", title: "Speaker notes (S)", action: "RevealNotes.open();" },
          { icon: "⌂", title: "Deck Hub",          action: "window.location.href='hub.html';" },
        ],
      },
    });

    initAnim(Reveal);            // KPI count-up + reduced-motion gate + ring-drift
    initInteractive(Reveal);     // funnel / carousel / slider / reveal-card / count-replay
    const { peek } = initDeckLink(Reveal);   // presenter sync + owns ?present=peek
    // Engage host: boots by default on the deck as the local-transport
    // authority. Room derives from opts.room || deck.meta.room || deck id,
    // so it is joinable locally out of the box. Skip on peek thumbnails.
    if (!peek) {
      const engage = initCollab(Reveal, { deck, deckId: safe });
      // Wave 4: poll-archetype auto-open + on-deck result bars + reaction
      // ticker, riding the SAME authority transport the host created.
      if (engage && engage.enabled) initHud(Reveal, engage);
    }

    /* Peek thumbnails (presenter previews): calm + correct — strip motion, fill count-ups */
    if (peek) {
      document.body.classList.add("is-peek");
      document.querySelectorAll(".count-up[data-count-to]")
        .forEach((el) => { el.textContent = el.getAttribute("data-count-to"); });
    }

    /* Presenter open + popup-block fallback (a user-gesture <a> is never blocked).
       The presenter must mirror THIS deck — forward the resolved ?deck id, else
       presenter.js falls back to its DEFAULT_DECK and shows the wrong deck. */
    const presenterUrl = (() => {
      const u = new URL("presenter.html", document.baseURI);
      u.searchParams.set("deck", safe);
      return u.toString();
    })();
    function showPresenterFallback() {
      if (document.getElementById("pv-fallback")) return;
      const bar = document.createElement("div");
      bar.id = "pv-fallback"; bar.className = "pv-fallback";
      bar.innerHTML = `Allow pop-ups, or <a href="${presenterUrl}" target="_blank" rel="noopener">Open presenter ↗</a>`;
      document.body.appendChild(bar);
    }
    function openPresenter() {
      const w = window.open(presenterUrl, "fmnts-presenter", "width=1280,height=800,menubar=no,toolbar=no");
      if (!w || w.closed || typeof w.closed === "undefined") showPresenterFallback();
    }
    const openBtn = document.getElementById("open-presenter");
    if (openBtn) openBtn.addEventListener("click", openPresenter);
    Reveal.addKeyBinding({ keyCode: 80, key: "P", description: "Open presenter view" }, openPresenter);

    /* Static PDF export: fill count-ups (they only animate on live slide-enter) */
    if (window.location.search.includes("print-pdf")) {
      document.body.classList.add("print-pdf");
      document.querySelectorAll(".count-up[data-count-to]")
        .forEach((el) => { el.textContent = el.getAttribute("data-count-to"); });
    }
  </script>
</body>
</html>
